name = "contact-form"
main = "worker.js"
compatibility_date = "2026-07-20"

# Same zone routes as the live Worker, so the site can POST same origin.
routes = [
  { pattern = "spritzconsulting.com/api/contact", zone_name = "spritzconsulting.com" },
  { pattern = "www.spritzconsulting.com/api/contact", zone_name = "spritzconsulting.com" }
]

# KV namespace holding submissions and rate-limit counters (live namespace).
[[kv_namespaces]]
binding = "CONTACT_SUBMISSIONS"
id = "151a51cc4d7b4e0c827dce67a3b15813"

# Notification email goes through the Google Apps Script web app in notify.gs.
# Both values below are set outside this file so neither lands in git:
#   npx wrangler secret put NOTIFY_WEBHOOK_URL   (the web app /exec URL)
#   npx wrangler secret put NOTIFY_SECRET        (same value as SHARED_SECRET in the script)
# If either is missing, the submission is still saved to KV and marked
# notified:false; the visitor still sees success.
