name = "checkout"
main = "worker.js"
compatibility_date = "2026-07-20"

# Order endpoints for the Steam Analysis page: /api/order, /api/order/config, /api/order/webhook, /api/order/promo, /api/order/free.
# The contact-form Worker keeps /api/contact; the two never overlap.
routes = [
  { pattern = "spritzconsulting.com/api/order*", zone_name = "spritzconsulting.com" },
  { pattern = "www.spritzconsulting.com/api/order*", zone_name = "spritzconsulting.com" }
]

# Same KV namespace as contact-form. This Worker only touches keys that start with "order:" or "free:".
[[kv_namespaces]]
binding = "CONTACT_SUBMISSIONS"
id = "151a51cc4d7b4e0c827dce67a3b15813"

[vars]
# Notification email (see README, "Notification email"): NOTIFY_URL, NOTIFY_SECRET and NOTIFY_TO are not kept here.
# Set them as secrets (npx wrangler secret put NAME) or in the dashboard. Without all three the Worker sends no email.
# MOVING TO LIVE: three things change, nothing else in this file.
#   1. PRICES                the two tier price ids (live products, not the sandbox ids below).
#   2. EXPRESS_PRICES        the two Express price ids from the live Express products (repeat them under eur, usd, gbp).
#   3. The Stripe secrets    STRIPE_SECRET_KEY (live restricted key) and STRIPE_WEBHOOK_SECRET
#                            (signing secret of the webhook endpoint created in live mode).
# PRICE_AMOUNTS and EXPRESS_AMOUNTS stay as they are as long as the live prices match the amounts there.
# Express delivery is off until this is "true". With it off the page hides the Express row
# and the Worker refuses express orders.
EXPRESS_ENABLED = "false"

# Stripe price ids of the two tiers. These are the SANDBOX ids; replace them with the live ids
# when the live products exist. Each price already carries its EUR, GBP and USD amounts.
PRICES = { standard = "price_1UcQHyJFkRG2ZYUJ6I1kIEzX", premium = "price_1UcO3WJFkRG2ZYUJbNZbcOh7" }

# Express add-on price ids, one entry per currency. Each Express price carries EUR, USD and GBP, so the same
# id repeats under "eur", "usd" and "gbp". These are the SANDBOX ids of "Express Delivery, Indie/Publisher Tier
# Steam Analysis". The first two prices created for them (EUR only) are archived: Stripe refuses an archived price in
# Checkout. The ids below are the current prices with EUR, USD and GBP. The dashboard holds the live copy of this
# variable, so keep the two in step.
# Stripe chooses the buyer's currency, so Express must be priced in all three: the same id and an amount for each.
# If one is empty or different, Express is off for that tier (the page hides the row, the Worker refuses the order).
EXPRESS_PRICES = { eur = { standard = "price_1UcSjmJFkRG2ZYUJfTNMrdXV", premium = "price_1UcSlMJFkRG2ZYUJSnGVxA4l" }, usd = { standard = "price_1UcSjmJFkRG2ZYUJfTNMrdXV", premium = "price_1UcSlMJFkRG2ZYUJSnGVxA4l" }, gbp = { standard = "price_1UcSjmJFkRG2ZYUJfTNMrdXV", premium = "price_1UcSlMJFkRG2ZYUJSnGVxA4l" } }

# Tier amounts the page shows, in whole currency units. They must equal the amounts of the Stripe tier prices.
# The Worker reads them for /api/order/config and, once a payment arrives, to check the paid total in the
# currency Stripe used (amountMatches in the KV record).
PRICE_AMOUNTS = { eur = { standard = 99, premium = 299 }, usd = { standard = 109, premium = 329 }, gbp = { standard = 89, premium = 249 } }

# Express amounts the page shows, same units. They must equal the Express prices above.
EXPRESS_AMOUNTS = { eur = { standard = 49, premium = 99 }, usd = { standard = 49, premium = 99 }, gbp = { standard = 49, premium = 99 } }

# Promotion codes. A code applies to one tier only (standard = Indie, premium = Publisher) and sends that Stripe coupon with
# the order. The coupons are limited to the tier's own product in Stripe, so the Express line is never discounted.
# "amounts" are the discounted tier amounts and drive the expected total (amountMatches). Set active = false to switch a code off.
# These are the SANDBOX coupons: swap the coupon ids for the live ones when the live coupons exist.
#   SOLODEV20  Indie       minus 20 EUR / 22 USD / 18 GBP  (coupon V7V7n4Fm)
#   SOLODEV10  Publisher   minus 30 EUR / 33 USD / 25 GBP  (coupon yZBBORrT)
PROMOS = { SOLODEV20 = { tier = "standard", coupon = "V7V7n4Fm", active = true, amounts = { eur = 79, usd = 87, gbp = 71 } }, SOLODEV10 = { tier = "premium", coupon = "yZBBORrT", active = true, amounts = { eur = 269, usd = 296, gbp = 224 } } }

# Indie to Publisher codes (INDIE-...). One-time promotion codes made by hand in Stripe on the coupon "Indie Publisher"
# (Publisher product only, 109 EUR / 120 USD / 91 GBP off, so Publisher costs 190 / 209 / 158). The Worker looks an INDIE- code up
# in Stripe and accepts it only when its coupon id equals this value. See the README for the dashboard steps.
# PASTE THE REAL ID HERE: Stripe dashboard > Product catalogue > Coupons > Indie Publisher > Details > ID.
# The Cloudflare dashboard does not read this file: add INDIE_PUBLISHER_COUPON_ID there as a plain text variable too.
# While the value starts with REPLACE, every INDIE- code is ignored and the order is charged in full. Sandbox and live have
# different coupons, so the live id replaces this one when the live coupon exists.
INDIE_PUBLISHER_COUPON_ID = "xNfXQp7l"

# Indie to Publisher amounts in whole units (list 299 / 329 / 249). Optional: without it the Worker uses 190 / 209 / 158.
INDIE_PUBLISHER_AMOUNTS = { eur = 190, usd = 209, gbp = 158 }

# Global discount in whole percent: 0 = prices as decided, 99 = test prices, 50 = a promotion. Add it in the dashboard too.
# Above 50 it only works with a test key or with ALLOW_DEEP_DISCOUNT = "true" (a second variable, set on purpose and removed after).
# With a value above 0 the Worker makes one coupon per order, which needs Coupons Write on the Stripe key (and Promotion codes Write
# to switch an INDIE- code off after payment). With 0 nothing changes: no coupon is made.
PRICE_PERCENT_OFF = 0

# Secrets (never in this file). Set them with:
#   npx wrangler secret put STRIPE_SECRET_KEY       (restricted key: Checkout Sessions Write, Promotion Codes Read, Coupons Read)
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET   (signing secret of the /api/order/webhook endpoint)
