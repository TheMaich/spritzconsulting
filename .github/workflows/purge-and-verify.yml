# After every GitHub Pages build: purge the Cloudflare cache, then check the live site.
# Secrets: CLOUDFLARE_API_TOKEN (Zone > Cache Purge > Purge, this zone only) and
# CLOUDFLARE_ZONE_ID. Without them the purge is skipped with a warning; the check still runs.
# See docs/deploy.md.
name: Purge cache and verify live site

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purge-and-verify
  cancel-in-progress: true

jobs:
  purge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare cache (whole zone)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ZONE_ID is not set: skipping the cache purge. See docs/deploy.md."
            exit 0
          fi
          # The token goes in through a header file, so it never appears on a command line or in the log.
          resp=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H @<(printf 'Authorization: Bearer %s\n' "$CF_TOKEN") \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if [ "$(jq -r '.success' <<<"$resp")" != "true" ]; then
            echo "::error::Cloudflare purge failed"
            jq '{success, errors, messages}' <<<"$resp"
            exit 1
          fi
          echo "Cloudflare cache purged."

  verify:
    needs: purge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the live site (custom domain)
        env:
          VERIFY_BASE_URL: https://spritzconsulting.com
        run: |
          # First check 60 s after the purge, then up to 5 retries, 60 s apart.
          sleep 60
          for attempt in 1 2 3 4 5 6; do
            echo "::group::Attempt $attempt"
            if node scripts/verify-live.mjs "$VERIFY_BASE_URL"; then
              echo "::endgroup::"
              echo "Live site passed on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            [ "$attempt" -lt 6 ] && sleep 60
          done
          echo "::error::Live site still failing after 5 retries."
          # Show the last table outside a collapsed group.
          node scripts/verify-live.mjs "$VERIFY_BASE_URL"
